name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate manifests, components, and shared-library sync
        run: node scripts/validate-plugins.mjs
      - name: Run tests
        run: node --test tests/mcp-servers.test.mjs tests/hooks.test.mjs tests/unit.test.mjs

  dogfood-security-scan:
    name: Scan this repository with secure-code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: secure-code scan (fails on high/critical)
        run: node plugins/secure-code/skills/secure-code-review/scripts/scan.mjs --path . --min-severity high >> "$GITHUB_STEP_SUMMARY"
